name: Supabase Free Tier Keep-Alive

on:
  schedule:
    # Runs at 00:00 UTC every 4 days to prevent 7-day auto-pause on Supabase Free Tier
    - cron: '0 0 */4 * *'
  workflow_dispatch: # Allows manual trigger from GitHub web UI

jobs:
  keep-alive:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST Endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: SUPABASE_URL or SUPABASE_ANON_KEY secret is not set."
            echo "Add them under GitHub Repo Settings -> Secrets and variables -> Actions"
            exit 1
          fi

          echo "Pinging Supabase at $SUPABASE_URL to prevent 7-day auto-pause..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/leads?select=id&limit=1")

          echo "Response HTTP Status: $RESPONSE"
          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 400 ]; then
            echo "SUCCESS: Supabase project successfully contacted and kept alive!"
          else
            echo "WARNING: Unexpected HTTP status $RESPONSE received from Supabase."
          fi
